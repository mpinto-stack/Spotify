 'guardadas':['As tuas preferidas','Músicas e artistas que marcaste com ♥ Gostei. Guardados apenas neste navegador.']
 }[category]||['Sugestões',''];}
function recRender(o){const hasMusic=recMusicScope(o).length>0;const lists=hasMusic?recCombined(o):{};const current=lists[R.category]||[];const filtered=current.filter(x=>R.feedback[x.key]?.rating!=='known'||R.category==='guardadas');const chosen=R.category==='surpreende'?[...filtered].sort((a,b)=>recHash(a.key+'|'+R.shuffle)-recHash(b.key+'|'+R.shuffle)):filtered;
 const [ttl,subtitle]=recSectionTitle(R.category);const lastFmAvailable=!!recOnlineItems();const missingKey=!(R.key||'').trim();
 const status=R.loading?`<div class="reco-status" role="status"><span class="reco-spinner"></span>${E(R.status||'A consultar Last.fm…')}</div>`:R.error?`<div class="reco-status error" role="alert">${E(R.error)}</div>`:R.status?`<div class="reco-status" role="status">${E(R.status)}</div>`:'';
 return `<div class="reco-top"><div>${headline('Descobrir música','Sugestões feitas a partir do teu histórico. Explora offline ou procura novos sons através do Last.fm.','A tua próxima descoberta')}<span class="reco-badge">◉ ${num((recMusicScope(o)).length)} músicas para conhecer o teu gosto</span></div><div class="reco-actions"><button class="reco-btn" data-rec-action="settings">⚙ Configurar Last.fm</button><button class="reco-btn" data-rec-action="export">↓ Exportar lista</button></div></div>
 <div class="reco-switch"><div class="reco-source" role="group" aria-label="Origem das recomendações"><button data-rec-mode="offline" class="${R.mode==='offline'?'active':''}" aria-pressed="${R.mode==='offline'}">⌁ Offline</button><button data-rec-mode="online" class="${R.mode==='online'?'active':''}" aria-pressed="${R.mode==='online'}">◌ Descobrir online</button></div><span class="reco-hint">${R.mode==='offline'?'Só músicas do teu histórico · sem internet':'Artistas e faixas novos · exige chave Last.fm e ligação à internet'}</span></div>
 ${R.mode==='online'&&!lastFmAvailable?`<div class="reco-note">${missingKey?'Para receber sugestões novas, abre <strong>Configurar Last.fm</strong> e insere uma chave API gratuita.':'Chave configurada. Clica em <strong>Procurar novas músicas</strong> para consultar o Last.fm.'} A pesquisa só envia nomes de alguns artistas/músicas escolhidos como referência, nunca o teu ZIP nem o histórico completo.</div>`:''}
 ${R.mode==='online'?`<div class="reco-actions" style="margin:14px 0"><button class="reco-btn strong" data-rec-action="fetch" ${R.loading||!hasMusic?'disabled':''}>${R.loading?'A procurar…':lastFmAvailable?'↻ Atualizar descobertas':'✧ Procurar novas músicas'}</button>${lastFmAvailable?'<span class="reco-hint">Resultados prontos · Last.fm</span>':''}</div>`:''}
 ${status}
 <div class="reco-categories" role="group" aria-label="Tipo de recomendação">${REC_TYPES.map(([id,icon,label])=>`<button data-rec-cat="${id}" class="${id===R.category?'active':''}" aria-pressed="${id===R.category}">${icon} ${label}${lists[id]?.length?` <span style="opacity:.6">${num(lists[id].length)}</span>`:''}</button>`).join('')}</div>
 <section class="reco-panel"><div class="reco-panel-title"><div><h2>${ttl}</h2><p>${subtitle}</p></div>${R.category==='surpreende'?'<button class="reco-btn" data-rec-action="shuffle">⤨ Baralhar</button>':''}</div>
 ${!hasMusic?`<div class="reco-empty"><strong>Não há músicas no filtro escolhido.</strong><p>Seleciona “Todos os tipos” ou “Música” no filtro superior para obter recomendações.</p></div>`:chosen.length?`<div class="reco-grid">${chosen.slice(0,R.count).map(recCard).join('')}</div>${chosen.length>R.count?`<div class="reco-bottom"><button class="reco-btn" data-rec-action="more">Ver mais sugestões (${num(chosen.length-R.count)} restantes)</button></div>`:''}`:`<div class="reco-empty"><strong>${R.category==='guardadas'?'Ainda não guardaste recomendações':R.mode==='offline'&&['novas-musicas','novos-artistas'].includes(R.category)?'Para sugestões inéditas, ativa o modo online':'Sem sugestões nesta categoria'}</strong><p>${R.category==='guardadas'?'Usa o botão ♥ Gostei numa música ou artista de outra categoria.':R.mode==='offline'&&['novas-musicas','novos-artistas'].includes(R.category)?'Um ZIP do Spotify só contém aquilo que já ouviste. Para sugerir coisas realmente novas, consulta o Last.fm.':'Experimenta outro ano, categoria ou faz uma pesquisa online.'}</p>${R.mode!=='online'?'<button class="reco-btn strong" data-rec-mode="online">◌ Descobrir online</button>':''}</div>`}</section>
 <p class="reco-method">As recomendações offline são heurísticas de popularidade, repetição e tempo desde a última escuta. As sugestões online usam dados de semelhança e popularidade do Last.fm, não uma probabilidade garantida de gostares. “Não ouvida” significa apenas que não foi identificada no histórico enviado. As avaliações ficam guardadas localmente no navegador.</p>`;
}
function recShowSettings(){const html=`<div class="modal"><div class="modal-top"><div><div class="eyebrow">Integração opcional</div><h2 style="font-size:25px;letter-spacing:-.04em;margin:4px 0 7px">Configurar Last.fm</h2><div class="muted">Para descobrires artistas e faixas novas, sem servidor próprio.</div></div><button class="icon-button" data-close aria-label="Fechar">×</button></div>
 <div class="reco-settings" style="margin-top:25px"><div><h3>A tua chave API</h3><p>Cria uma conta de API gratuita no Last.fm. Precisas apenas da <strong>API Key</strong>, não do “Shared secret”, login ou palavra-passe.</p><form id="rec-key-form"><label class="small muted" for="rec-api-key" style="display:block;margin:0 0 6px">API Key do Last.fm</label><div class="reco-keyrow"><input id="rec-api-key" type="password" autocomplete="off" spellcheck="false" value="${E(R.key)}" placeholder="Colar chave API aqui" maxlength="100"><button class="reco-btn strong" type="submit">Aplicar chave</button></div><label class="reco-remember"><input id="rec-api-remember" type="checkbox" ${R.remember?'checked':''}> Guardar a chave neste navegador, neste dispositivo</label></form><p style="margin-top:10px">Podes apagar a chave guardada a qualquer momento.</p><button class="reco-btn" type="button" data-rec-action="remove-key">Apagar chave</button> <button class="reco-btn" type="button" data-rec-action="reset-feedback">Limpar avaliações</button><div id="rec-key-message" class="reco-hint" aria-live="polite" style="margin-top:12px"></div></div><div class="reco-info"><h3>Como obter a chave</h3><p>1. Abre a página <a href="https://www.last.fm/api/account/create" target="_blank" rel="noopener noreferrer">Criar conta de API Last.fm ↗</a>.</p><p>2. Inicia sessão e preenche o nome e a descrição da aplicação (por exemplo, “Spotify Atlas Pessoal”).</p><p>3. Copia o valor <strong>API Key</strong> e cola-o no campo à esquerda.</p><p>4. Clica em <strong>Aplicar chave</strong>, fecha esta janela e usa <strong>Descobrir online → Procurar novas músicas</strong>.</p></div></div><div class="reco-note" style="margin-top:22px"><strong>Privacidade:</strong> O ZIP e o histórico completo ficam no teu dispositivo. Apenas os nomes de algumas músicas e artistas são enviados ao Last.fm quando inicias uma pesquisa online. A chave é usada no navegador e não é secreta quando enviada à API. <strong>Nunca publiques o Shared secret.</strong> Num GitHub Pages público, não coloques a chave ou segredos diretamente no ficheiro HTML. A área de recomendações offline funciona sem chave.</div></div>`;
 $('modal').innerHTML=html;$('modal').classList.remove('hidden');document.body.style.overflow='hidden';}
function recApplyKey(){const input=$('rec-api-key'),k=(input?.value||'').trim();if(!/^[a-z0-9]{20,64}$/i.test(k)){const msg=$('rec-key-message');if(msg)msg.textContent='Esta chave não parece válida. Confirma o valor API Key (normalmente 32 caracteres).';return;}R.key=k;R.remember=!!$('rec-api-remember')?.checked;if(R.remember)recSave(REC_STORAGE_KEY,k);else try{localStorage.removeItem(REC_STORAGE_KEY);}catch{}R.online=null;R.onlineScope='';R.status='Chave aplicada. Já podes procurar recomendações online.';R.error='';$('modal').classList.add('hidden');$('modal').innerHTML='';document.body.style.overflow='';render();}
function recRate(key,rating){const items=recCombined(getScope()),found=Object.values(items).flat().find(i=>i.key===key)||R.feedback[key]?.item;if(!found)return;const old=R.feedback[key]?.rating;if(old===rating){delete R.feedback[key];}else{R.feedback[key]={rating,item:{...found,image:found.image||''}};}recSave(REC_STORAGE_FEEDBACK,R.feedback);render();}
function recExport(){const items=recCombined(getScope())[R.category]||[];csvDownload('recomendacoes_'+R.category,['Tipo','Música / sugestão','Artista','Razão','Origem','URL Spotify','Avaliação'],items.map(x=>[x.kind==='artist'?'Artista':'Música',x.title,x.artist,x.reason,x.source,recSpotUrl(x),R.feedback[x.key]?.rating||'']));}
async function recLastfm(method,params){
 const query=new URLSearchParams({...params,method,api_key:R.key,format:'json',autocorrect:'1'});
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const res=await fetch('https://ws.audioscrobbler.com/2.0/?'+query.toString(),{signal:controller.signal,mode:'cors',credentials:'omit',cache:'no-store'});
  if(!res.ok)throw new Error(`Last.fm respondeu com HTTP ${res.status}.`);
  const json=await res.json();
  if(json?.error)throw new Error('Last.fm: '+(json.message||`Erro ${json.error}`));
  return json||{};
 }catch(e){
  if(e.name==='AbortError')throw new Error('O Last.fm não respondeu em 12 segundos.');
  if(e instanceof TypeError)throw new Error('Falha de ligação ao Last.fm (internet ou CORS).');
  throw e;
 }finally{clearTimeout(timer);}
}

function recLFArray(input){return Array.isArray(input)?input:(input?[input]:[]);}
function recOnlineTrack(name,artist,score,reason,images){const it=recItem('track',name,artist,score,reason,'Last.fm',recImage(images));return it;}
function recOnlineArtist(name,score,reason,images){return recItem('artist','Descobrir artista',name,score,reason,'Last.fm',recImage(images));}
function recSeedArtists(o){const sorted=[...o.artists].filter(([id,st])=>st.plays>=2&&S.artists[id]!=='Artista desconhecido').sort((a,b)=>b[1].ms-a[1].ms);
 const selected=[],used=new Set();
 const add=(name,ms)=>{if(!name||used.has(recNorm(name))||selected.length>=5)return;selected.push({name,ms});used.add(recNorm(name));};
 for(const v of Object.values(R.feedback)){if(v?.rating==='like'&&v.item?.artist)add(v.item.artist,Math.max(9000000,sorted[0]?.[1].ms||0));}
 for(const [id,st] of sorted)add(S.artists[id],st.ms);
 return selected;}
function recSeedTracks(o){const s=recMusicScope(o).filter(([id,st])=>st.plays>=2).sort((a,b)=>b[1].ms-a[1].ms);const found=[],artists=new Set(),seen=new Set();
 const add=(name,artist,ms)=>{const key=recNorm(artist)+'|'+recNorm(name);if(!name||!artist||seen.has(key)||found.length>=4)return;found.push({name,artist,ms});seen.add(key);artists.add(recNorm(artist));};
 for(const v of Object.values(R.feedback)){const item=v?.item;if(v?.rating==='like'&&item?.kind==='track'&&found.length<2)add(item.title,item.artist,9000000);}
 for(const [id,st] of s){const tr=S.tracks[id];if(!artists.has(recNorm(tr.artist)))add(tr.title,tr.artist,st.ms);if(found.length>=4)break;}return found;}

async function recFetch(){if(R.loading)return;if(!R.key){R.mode='online';R.error='É necessária uma chave API do Last.fm. Usa “Configurar Last.fm”.';render();recShowSettings();return;}
 const o=getScope(),seeds=recSeedArtists(o),tracks=recSeedTracks(o);if(!seeds.length&&!tracks.length){R.error='Não há escutas de música suficientes no filtro escolhido.';render();return;}
 const key=`${S.year}|${S.media}|${S.events.length}`,token=++R.run;R.loading=true;R.error='';R.status='A escolher os artistas de referência…';R.mode='online';render();
 const known=recKnown(),next={'para-ti':[],'novas-musicas':[],'novos-artistas':[],'lado-b':[],'fora-bolha':[],'redescobrir':[],'surpreende':[],'guardadas':[]};let failures=0,done=0,firstError='';
 const jobs=[];
 for(const seed of seeds.slice(0,4))jobs.push({label:'Artistas semelhantes a '+seed.name,method:'artist.getSimilar',params:{artist:seed.name,limit:'26'},kind:'similar-artists',seed});
 for(const seed of tracks.slice(0,4))jobs.push({label:'Músicas semelhantes a '+seed.name,method:'track.getSimilar',params:{artist:seed.artist,track:seed.name,limit:'25'},kind:'similar-tracks',seed});
 for(const seed of seeds.slice(0,3))jobs.push({label:'Outras músicas de '+seed.name,method:'artist.getTopTracks',params:{artist:seed.name,limit:'35'},kind:'artist-tracks',seed});
 const discoveredArtists=[];
 async function perform(job){if(token!==R.run)return;done++;R.status=`A descobrir música · ${done}/${jobs.length+(discoveredArtists.length?2:0)} · ${job.label}`;const statusEl=$('content').querySelector('.reco-status');if(statusEl&&R.loading)statusEl.textContent=R.status;
  const json=await recLastfm(job.method,job.params);if(token!==R.run)return;
  if(job.kind==='similar-artists'){
   for(const a of recLFArray(json.similarartists?.artist)){const artist=String(a.name||'').trim(),match=Math.max(0,Math.min(1,Number(a.match)||0));if(!artist||known.artists.has(recNorm(artist)))continue;
    const score=match*20+Math.log1p(job.seed.ms/60000)*.3;const why=`Semelhante a ${job.seed.name} segundo o Last.fm · afinidade entre artistas ${Math.round(match*100)}/100.`;const item=recOnlineArtist(artist,score,why,a.image);next['novos-artistas'].push(item);next['para-ti'].push(item);discoveredArtists.push({name:artist,seed:job.seed.name,score,match});if(match<0.65){next['fora-bolha'].push(item);next['surpreende'].push(item);}
   }
  }else if(job.kind==='similar-tracks'){
   for(const t of recLFArray(json.similartracks?.track)){const name=String(t.name||'').trim(),artist=String(t.artist?.name||t.artist||'').trim();if(!name||!artist||known.tracks.has('track|'+recNorm(artist)+'|'+recNorm(name)))continue;
    const match=Math.max(0,Math.min(1,Number(t.match)||0));const score=match*19+Math.log1p(job.seed.ms/60000)*.4;
    const item=recOnlineTrack(name,artist,score,`Parecida com “${job.seed.name}”, de ${job.seed.artist} · semelhança Last.fm ${Math.round(match*100)}/100.`,t.image);next['novas-musicas'].push(item);next['para-ti'].push(item);next['surpreende'].push(item);if(match<.55)next['fora-bolha'].push(item);
   }
  }else if(job.kind==='artist-tracks'||job.kind==='new-artist-tracks'){
   let pos=0;for(const t of recLFArray(json.toptracks?.track)){pos++;const name=String(t.name||'').trim(),artist=String(t.artist?.name||t.artist||job.seed.name).trim();if(!name||!artist||known.tracks.has('track|'+recNorm(artist)+'|'+recNorm(name)))continue;
    const score=(job.kind==='artist-tracks'?11:9)+(40-pos)*.09+(job.seed.score||0)*.1;
    const why=job.kind==='artist-tracks'?`Outra música de ${job.seed.name}, que ouves bastante. Posição ${pos} entre as mais populares no Last.fm.`:`Música de um novo artista semelhante a ${job.seed.seed} · ${job.seed.name}.`;
    const item=recOnlineTrack(name,artist,score,why,t.image);
    if(job.kind==='artist-tracks')next['lado-b'].push(item);else{next['novas-musicas'].push(item);next['para-ti'].push(item);next['surpreende'].push(item);}
   }
  }
 }
 try{
  for(const job of jobs){try{await perform(job);}catch(e){failures++;firstError||=e.message;console.warn('Consulta Last.fm falhou:',job.method, e);if(/Invalid API|Invalid api|Suspended API|Erro 10|Erro 26|Rate limit/i.test(e.message))throw e;}await new Promise(r=>setTimeout(r,275));}
  const newArtists=[...new Map(discoveredArtists.sort((a,b)=>b.score-a.score).map(x=>[recNorm(x.name),x])).values()].slice(0,3);
  for(const artist of newArtists){try{await perform({label:'Uma faixa de '+artist.name,method:'artist.getTopTracks',params:{artist:artist.name,limit:'18'},kind:'new-artist-tracks',seed:artist});}catch(e){failures++;firstError||=e.message;}await new Promise(r=>setTimeout(r,275));}
  if(token!==R.run)return;
  for(const k of Object.keys(next))next[k]=recDistinct(next[k]).filter(x=>R.feedback[x.key]?.rating!=='hide').sort((a,b)=>b.score-a.score).slice(0,150);
  const total=next['novas-musicas'].length+next['novos-artistas'].length+next['lado-b'].length;
  R.online=next;R.onlineScope=key;R.count=12;
  R.status=total?`${num(next['novas-musicas'].length)} músicas e ${num(next['novos-artistas'].length)} artistas por descobrir. ${failures?`${failures} consultas não responderam.`:''}`:'A consulta terminou, mas não devolveu sugestões novas para o histórico selecionado.';
  R.error=total?'':failures?firstError||'Alguns pedidos falharam.':'Não foram encontradas correspondências no Last.fm.';
 }catch(e){if(token!==R.run)return;R.error=e.message||'Não foi possível obter recomendações.';R.status='';}
 finally{if(token===R.run){R.loading=false;render();}}
}
function recClick(e){const cat=e.target.closest('[data-rec-cat]');if(cat){R.category=cat.dataset.recCat;R.count=12;render();return true;}
 const mode=e.target.closest('[data-rec-mode]');if(mode){R.mode=mode.dataset.recMode;R.count=12;R.error='';R.status='';render();return true;}
 const rate=e.target.closest('[data-rec-rate]');if(rate){recRate(rate.dataset.recKey,rate.dataset.recRate);return true;}
 const action=e.target.closest('[data-rec-action]');if(!action)return false;
 switch(action.dataset.recAction){case'settings':recShowSettings();break;case'fetch':recFetch();break;case'more':R.count+=18;render();break;case'shuffle':R.shuffle++;R.count=12;render();break;case'export':recExport();break;case'remove-key':R.key='';R.remember=false;R.online=null;R.onlineScope='';try{localStorage.removeItem(REC_STORAGE_KEY);}catch{}if($('rec-api-key'))$('rec-api-key').value='';if($('rec-api-remember'))$('rec-api-remember').checked=false;if($('rec-key-message'))$('rec-key-message').textContent='A chave foi apagada deste navegador.';break;case'reset-feedback':if(confirm('Apagar as avaliações Gostei, Conheço e Não gosto guardadas neste navegador?')){R.feedback={};recSave(REC_STORAGE_FEEDBACK,{});if($('rec-key-message'))$('rec-key-message').textContent='Avaliações apagadas.';}break;}
 return true;}
$('content').addEventListener('click',recClick);
$('modal').addEventListener('submit',e=>{if(e.target.id==='rec-key-form'){e.preventDefault();recApplyKey();}});

$('yearfilter').addEventListener('change',e=>{S.year=e.target.value;S.scopeCache=null;S.page=1;render();});
$('mediafilter').addEventListener('change',e=>{S.media=e.target.value;S.scopeCache=null;S.page=1;render();});

$('content').addEventListener('click',e=>{const ent=e.target.closest('[data-entity]');if(ent){showDetail(ent.dataset.entity,Number(ent.dataset.id));return;}const p=e.target.closest('[data-page]');if(p){S.page=Math.max(1,Number(p.dataset.page));render();return;}const met=e.target.closest('[data-metric]');if(met){S.metric=met.dataset.metric;S.page=1;render();return;}const ex=e.target.closest('[data-export]');if(ex){exportData(ex.dataset.export);return;}});
$('content').addEventListener('change',e=>{if(e.target.id==='rankMode'){S.rankMode=e.target.value;S.page=1;render();}});
let searchTimer;
$('content').addEventListener('input',e=>{if(e.target.id!=='tableSearch')return;S.q=e.target.value;S.page=1;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const pos=e.target.selectionStart;render();const replacement=$('tableSearch');if(replacement){replacement.focus();replacement.setSelectionRange(pos,pos);}},220);});
$('modal').addEventListener('click',e=>{const ent=e.target.closest('[data-entity]');if(ent){showDetail(ent.dataset.entity,Number(ent.dataset.id));return;}if(e.target.id==='modal'||e.target.closest('[data-close]'))closeDetail();});
